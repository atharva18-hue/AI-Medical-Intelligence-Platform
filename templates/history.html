<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History - Advanced AI Medical Intelligence Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🩺 Advanced AI Medical Intelligence Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Analyze</a>
                <a class="nav-link active" href="/history-page">History</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="page-header mb-4">
            <h2>Prediction History</h2>
            <p class="text-muted">All previous analyses stored in database</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div id="historyLoading" class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                </div>
                <div id="historyTable" class="d-none">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Filename</th>
                                <th>Prediction</th>
                                <th>Confidence</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
                <div id="historyEmpty" class="text-center py-4 d-none text-muted">
                    No predictions yet. <a href="/">Analyze an image</a> first.
                </div>
            </div>
        </div>
    </div>

    <!-- modal for report detail -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Report Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="modalReport" class="report-box"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/history.js"></script>
</body>
</html>
